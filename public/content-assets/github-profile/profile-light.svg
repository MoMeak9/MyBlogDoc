<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Engineering with intelligence</title>
  <desc id="desc">An orbital code core framed by blue, cyan, and violet aurora light. Decorative motion pauses when reduced motion is preferred.</desc>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087e96"/><stop offset=".45" stop-color="#245bdd"/><stop offset="1" stop-color="#7954cb"/></linearGradient>
    <linearGradient id="fade"><stop stop-color="#087e96" stop-opacity="0"/><stop offset=".5" stop-color="#245bdd"/><stop offset="1" stop-color="#7954cb" stop-opacity="0"/></linearGradient>
    <radialGradient id="sphere" cx=".3" cy=".2" r=".9"><stop stop-color="#245bdd" stop-opacity=".32"/><stop offset="1" stop-color="#7954cb" stop-opacity=".03"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3"/></filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#b2c2dc" stroke-opacity=".17"/></pattern>
    <clipPath id="clip"><rect width="960" height="360" rx="16"/></clipPath>
  </defs>
  <style>
    .orbit { animation: orbit 36s linear infinite; transform-origin: 0px 0px; }
    .reverse { animation: orbit 48s linear infinite reverse; transform-origin: 0px 0px; }
    .signal { animation: signal 8s linear infinite; }
    .breathe { animation: breathe 7s ease-in-out infinite alternate; }
    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes signal { to { stroke-dashoffset: -360; } }
    @keyframes breathe { from { opacity: .3; } to { opacity: .65; } }
    @media (prefers-reduced-motion: reduce) { .orbit, .reverse, .signal, .breathe { animation: none !important; } }
  </style>
  <g clip-path="url(#clip)">
    <rect width="960" height="360" fill="#f4f7fd"/>
    <rect x="510" width="450" height="360" fill="url(#grid)"/>
    <g filter="url(#blur)" class="breathe">
      <path d="M390 365 Q600 50 1010 155" fill="none" stroke="#7954cb" stroke-width="78" stroke-opacity=".36"/>
      <path d="M420 385 Q730 240 980 -20" fill="none" stroke="#087e96" stroke-width="52" stroke-opacity=".3"/>
    </g>
    <path d="M430 360 Q650 70 990 140" stroke="url(#edge)" stroke-opacity=".28" fill="none"/>
    <path d="M470 370 Q690 104 990 168" stroke="url(#edge)" stroke-opacity=".14" fill="none"/>
    <path d="M42 42H62M42 42V62M918 318H898M918 318V298" stroke="#245bdd" stroke-opacity=".6"/>
    <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
      <text x="64" y="68" font-size="15" fill="#506581">MoMeak9 / AI Native Engineer</text>
      <text x="62" y="147" font-size="54" font-weight="650" fill="#142443">Engineering</text>
      <text x="62" y="205" font-size="46" font-weight="600" fill="url(#edge)">with intelligence.</text>
      <text x="64" y="248" font-size="18" fill="#506581">From thoughtful interfaces to connected systems.</text>
      <path d="M64 281H460" stroke="#b2c2dc" stroke-opacity=".5"/>
      <text x="64" y="310" font-size="14" fill="#506581">Frontend craft</text>
      <circle cx="180" cy="305" r="2" fill="#087e96"/>
      <text x="198" y="310" font-size="14" fill="#506581">Full-stack depth</text>
      <circle cx="325" cy="305" r="2" fill="#7954cb"/>
      <text x="343" y="310" font-size="14" fill="#506581">AI workflows</text>
    </g>
    <g transform="translate(755 176)">
      <circle r="121" fill="url(#sphere)"/>
      <circle r="122" stroke="#b2c2dc" stroke-opacity=".7"/>
      <circle r="144" stroke="#b2c2dc" stroke-opacity=".4" stroke-dasharray="2 10"/>
      <ellipse rx="153" ry="58" transform="rotate(-32)" stroke="url(#edge)" stroke-opacity=".65"/>
      <ellipse rx="153" ry="58" transform="rotate(32)" stroke="#245bdd" stroke-opacity=".22"/>
      <g class="orbit">
        <circle r="122" stroke="url(#edge)" stroke-width="2" stroke-dasharray="100 666"/>
        <circle cx="122" r="4" fill="#087e96"/>
        <circle cx="122" r="8" fill="#087e96" opacity=".4" filter="url(#glow)"/>
      </g>
      <g class="reverse"><circle r="95" stroke="#7954cb" stroke-opacity=".7" stroke-dasharray="30 55"/><circle cy="-144" r="3" fill="#7954cb"/></g>
      <path d="M0 -66L57 -33V33L0 66L-57 33V-33Z" fill="#f4f7fd" fill-opacity=".78" stroke="url(#edge)" stroke-width="1.5"/>
      <path d="M0 -51L44 -25V25L0 51L-44 25V-25Z" fill="url(#sphere)" stroke="#b2c2dc" stroke-opacity=".5"/>
      <path d="M-20 -12L-33 0L-20 12M20 -12L33 0L20 12M8 -22L-8 22" stroke="url(#edge)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="959" height="359" rx="16" stroke="#b2c2dc" stroke-opacity=".55"/>
</svg>
